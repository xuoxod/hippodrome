[package]
name = "hippodrome"
version = "0.1.0"
edition = "2021"
authors = ["Rick Walker <xuoxod@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Sovereign speculative hedged racing & upstream tournament engine in pure Rust. Replaces naive round-robin with microsecond fastest-horse concurrency."
repository = "https://github.com/xuoxod/hippodrome"
readme = "README.md"
keywords = ["load-balancing", "hedged-requests", "speculative-concurrency", "dns", "low-latency"]
categories = ["network-programming", "asynchronous"]

[[bin]]
name = "hippodrome"
path = "src/main.rs"

[lib]
name = "hippodrome"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
tempfile = "3.10"
